<div style="padding: 30px; font-family: Arial, sans-serif;">
  <h1>Panel de Control (Dashboard)</h1>
  <p>¡Bienvenido a NOVATECH!</p>

  <div style="margin-top: 20px;">
    <!-- Botón de prueba para forzar una petición HTTP -->
    <button (click)="probarPeticion()" style="padding: 10px 15px; background-color: #3b82f6; color: white; border: none; border-radius: 5px; cursor: pointer; margin-right: 10px;">
      Probar Petición al Servidor
    </button>

    <!-- Botón para salir -->
    <button (click)="cerrarSesion()" style="padding: 10px 15px; background-color: #ef4444; color: white; border: none; border-radius: 5px; cursor: pointer;">
      Cerrar Sesión
    </button>
  </div>
</div>
